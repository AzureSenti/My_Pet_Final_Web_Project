version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: mypet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mypet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypet_password}
      POSTGRES_DB: ${POSTGRES_DB:-mypet_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mypet_user} -d ${POSTGRES_DB:-mypet_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment below to run pgAdmin (optional DB management UI)
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: mypet_pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@mypet.dev
  #     PGADMIN_DEFAULT_PASSWORD: admin123
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - db

volumes:
  postgres_data:
    driver: local
